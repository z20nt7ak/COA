openapi: "3.0.3"
info:
  title: BARS — связи лабораторных и дисциплин
  version: "1.0"
servers:
  - url: https://localhost:8443/bars

paths:
  /discipline/{discipline-id}/labwork/{labwork-id}/add:
    post:
      description: "Добавить лабораторную работу в программу дисциплины"
      parameters:
        - name: discipline-id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: labwork-id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: "Лабораторная работа добавлена в программу дисциплины"
        "400":
          description: "Некорректный id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Дисциплина или лабораторная работа не найдена"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "409":
          description: У лабораторной работы уже есть дисциплина
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /discipline/{discipline-id}/labwork/{labwork-id}/remove:
    post:
      description: "Удалить лабораторную работу из программы дисциплины"
      parameters:
        - name: discipline-id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: labwork-id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: "Лабораторная работа удалена из программы дисциплины"
        "400":
          description: "Некорректный id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Лабораторная работа не найдена или не относится к указанной дисциплине"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
        error:
          type: string
        message:
          type: string
